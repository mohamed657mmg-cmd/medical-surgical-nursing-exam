<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Internal Medicine Exam</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#07152f,#123c70);
    padding:18px;
    color:#222;
}

.container{
    width:100%;
    max-width:850px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:22px;
    padding:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.30);
}

/* البداية */

.start-page{
    text-align:center;
    margin-top:45px;
}

.start-page h1{
    color:#123c70;
    font-size:36px;
    margin-bottom:10px;
}

.subtitle{
    color:#555;
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

.pray{
    background:#f2f6fb;
    border-radius:15px;
    padding:18px;
    margin:20px 0;
    font-size:22px;
    font-weight:bold;
    color:#123c70;
}

.heart{
    color:#e63946;
}

input{
    width:100%;
    padding:16px;
    border:2px solid #ddd;
    border-radius:13px;
    font-size:17px;
    outline:none;
    text-align:right;
    margin:10px 0 18px;
}

input:focus{
    border-color:#123c70;
}

.start-btn,
.submit-btn{
    width:100%;
    padding:16px;
    border:0;
    border-radius:13px;
    background:#123c70;
    color:white;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
}

.start-btn:hover,
.submit-btn:hover{
    background:#0b2b54;
}

/* الامتحان */

.exam-header{
    text-align:center;
    margin-bottom:25px;
}

.exam-header h2{
    color:#123c70;
    margin:5px 0 10px;
    font-size:28px;
}

.student{
    color:#555;
    font-size:17px;
}

.badge{
    display:inline-block;
    background:#123c70;
    color:white;
    padding:8px 18px;
    border-radius:20px;
    margin-top:12px;
}

/* السؤال */

.question{
    background:#f7f9fc;
    border:1px solid #e1e6ed;
    border-radius:16px;
    padding:18px;
    margin-bottom:20px;
}

.question-title{
    font-size:18px;
    font-weight:bold;
    line-height:1.7;
    margin-bottom:13px;
    direction:ltr;
    text-align:left;
}

.option{
    display:block;
    width:100%;
    text-align:left;
    direction:ltr;
    background:white;
    border:2px solid #ddd;
    color:#222;
    border-radius:12px;
    padding:14px;
    margin:8px 0;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    border-color:#123c70;
    background:#f1f6ff;
}

.option.selected{
    background:#123c70;
    color:white;
    border-color:#123c70;
}

.option:disabled{
    cursor:not-allowed;
}

/* النتيجة */

.result{
    text-align:center;
}

.result h1{
    color:#123c70;
}

.score{
    font-size:48px;
    font-weight:bold;
    color:#123c70;
    margin:15px 0;
}

.percentage{
    font-size:28px;
    font-weight:bold;
    color:#198754;
}

.success{
    background:#eaf8ef;
    color:#198754;
    border-radius:13px;
    padding:15px;
    margin:20px 0;
    font-weight:bold;
}

/* المراجعة */

.review-title{
    color:#123c70;
    text-align:center;
    margin-top:30px;
}

.review-item{
    padding:16px;
    border-radius:14px;
    margin:12px 0;
    text-align:left;
    direction:ltr;
}

.review-item.correct{
    background:#eaf8ef;
    border-right:5px solid #198754;
}

.review-item.wrong{
    background:#fff0f0;
    border-right:5px solid #dc3545;
}

.review-question{
    font-weight:bold;
    line-height:1.7;
    margin-bottom:10px;
}

.correct-message{
    color:#198754;
    font-weight:bold;
}

.wrong-answer{
    color:#dc3545;
    font-weight:bold;
    margin:6px 0;
}

.correct-answer{
    color:#198754;
    font-weight:bold;
    margin:6px 0;
}

/* الحقوق */

.footer{
    text-align:center;
    margin-top:35px;
    padding-top:22px;
    border-top:1px solid #ddd;
}

.designer{
    color:#123c70;
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.author{
    color:#555;
    font-size:17px;
    font-weight:bold;
}

.hidden{
    display:none;
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .card{
        padding:17px;
        border-radius:18px;
    }

    .start-page{
        margin-top:20px;
    }

    .start-page h1{
        font-size:30px;
    }

    .pray{
        font-size:19px;
    }

    .exam-header h2{
        font-size:23px;
    }

    .question-title{
        font-size:17px;
    }

    .option{
        font-size:15px;
        padding:13px;
    }
}

</style>
</head>


<body>

<div class="container">

<!-- ================= صفحة البداية ================= -->

<div class="card start-page" id="startPage">

    <h1>اختبار</h1>

    <div class="subtitle">
        Internal Medicine
    </div>

    <div class="pray">
        قبل ما تبدأ تحل
        <br>
        صلّي على النبي ﷺ
        <span class="heart">❤️</span>
    </div>

    <input
        type="text"
        id="studentName"
        placeholder="اكتب اسمك بالكامل"
        autocomplete="off"
    >

    <button
        class="start-btn"
        onclick="startExam()"
    >
        ابدأ الامتحان
    </button>

</div>


<!-- ================= صفحة الامتحان ================= -->

<div class="card hidden" id="examPage">

    <div class="exam-header">

        <h2>
            Internal Medicine
        </h2>

        <div class="student">
            الطالب:
            <strong id="displayName"></strong>
        </div>

        <div class="badge">
            12 Questions
        </div>

    </div>

    <div id="questionsContainer"></div>

    <button
        class="submit-btn"
        onclick="submitExam()"
    >
        تسليم الامتحان
    </button>

</div>


<!-- ================= صفحة النتيجة ================= -->

<div class="card hidden" id="resultPage">

    <div class="result">

        <h1>
            نتيجة الامتحان
        </h1>

        <p>
            الطالب:
            <strong id="resultStudent"></strong>
        </p>

        <div
            class="score"
            id="scoreText"
        >
            0 / 12
        </div>

        <div
            class="percentage"
            id="percentageText"
        >
            0%
        </div>

        <div class="success">
            تم تسليم الامتحان بنجاح ❤️
        </div>

    </div>

    <h2 class="review-title">
        مراجعة الإجابات
    </h2>

    <div id="reviewContainer"></div>

    <div class="footer">

        <div class="designer">
            Designed by Mohamed Mahmoud
        </div>

        <div class="author">
            Exam Author: Omar Abdel-Tawab
        </div>

    </div>

</div>

</div>


<script>

/* =====================================================
   أسئلة طب باطنة
===================================================== */

const questions = [

{
    question:"Which of the following is part of innate immunity?",
    options:[
        "Antibodies",
        "B lymphocytes",
        "Skin and mucous membranes",
        "Memory cells"
    ],
    answer:"Skin and mucous membranes"
},

{
    question:"Active acquired immunity is characterized by:",
    options:[
        "Receiving ready-made antibodies",
        "No memory cell formation",
        "Formation of memory cells",
        "Occurring only after blood transfusion"
    ],
    answer:"Formation of memory cells"
},

{
    question:"Which of the following is an example of passive immunity?",
    options:[
        "Vaccination",
        "Natural infection",
        "Receiving immunoglobulins",
        "Activation of T-cells"
    ],
    answer:"Receiving immunoglobulins"
},

{
    question:"The main cause of angina pectoris is:",
    options:[
        "Increased heart rate",
        "Narrowing of coronary arteries",
        "Low hemoglobin",
        "Lung infection"
    ],
    answer:"Narrowing of coronary arteries"
},

{
    question:"Which of the following is NOT a risk factor for angina?",
    options:[
        "Smoking",
        "Physical activity",
        "Obesity",
        "High cholesterol"
    ],
    answer:"Physical activity"
},

{
    question:"Atherosclerosis is defined as:",
    options:[
        "Lack of oxygen in blood",
        "Deposition of fats in arterial walls",
        "Increase in white blood cells",
        "Bacterial infection"
    ],
    answer:"Deposition of fats in arterial walls"
},

{
    question:"A typical symptom of angina pectoris is:",
    options:[
        "Abdominal pain only",
        "Pain radiating to the arm or shoulder",
        "Hearing loss",
        "Skin rash"
    ],
    answer:"Pain radiating to the arm or shoulder"
},

{
    question:"Which investigation is commonly used to diagnose angina?",
    options:[
        "Urine analysis",
        "ECG",
        "Blood sugar test",
        "X-ray only"
    ],
    answer:"ECG"
},

{
    question:"The key difference between angina and myocardial infarction (MI) is:",
    options:[
        "Angina is more severe",
        "MI causes no pain",
        "MI involves complete blockage of a coronary artery",
        "Angina causes permanent heart damage"
    ],
    answer:"MI involves complete blockage of a coronary artery"
},

{
    question:"Which of the following is a complication of myocardial infarction?",
    options:[
        "Improved breathing",
        "Heart failure",
        "Increased energy",
        "Muscle strengthening"
    ],
    answer:"Heart failure"
},

{
    question:"Hypertension is diagnosed when blood pressure is:",
    options:[
        "120/80 mmHg",
        "130/85 mmHg",
        "140/90 mmHg or higher",
        "100/60 mmHg"
    ],
    answer:"140/90 mmHg or higher"
},

{
    question:"In CPR, the correct compression-to-breath ratio mentioned is:",
    options:[
        "1:1",
        "2:1",
        "4:1",
        "10:2"
    ],
    answer:"4:1"
}

];


/* =====================================================
   المتغيرات
===================================================== */

let studentName = "";

let selectedAnswers =
    new Array(questions.length).fill(null);


/* =====================================================
   خلط الاختيارات
===================================================== */

function shuffle(array){

    let arr = [...array];

    for(let i = arr.length - 1; i > 0; i--){

        let j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [arr[i], arr[j]] =
        [arr[j], arr[i]];

    }

    return arr;
}


/* =====================================================
   بدء الامتحان
===================================================== */

function startExam(){

    const input =
        document.getElementById("studentName");

    studentName =
        input.value.trim();

    if(studentName === ""){

        alert("من فضلك اكتب اسمك بالكامل أولاً");

        input.focus();

        return;
    }

    document
        .getElementById("startPage")
        .classList.add("hidden");

    document
        .getElementById("examPage")
        .classList.remove("hidden");

    document
        .getElementById("displayName")
        .textContent = studentName;

    renderQuestions();
}


/* =====================================================
   عرض الأسئلة
===================================================== */

function renderQuestions(){

    const container =
        document.getElementById(
            "questionsContainer"
        );

    container.innerHTML = "";

    selectedAnswers =
        new Array(questions.length).fill(null);


    /*
       نخلط ترتيب الأسئلة نفسه
       لكل طالب
    */

    const shuffledQuestions =
        questions.map((question,index)=>({
            ...question,
            originalIndex:index
        }));

    shuffledQuestions.sort(
        ()=>Math.random()-0.5
    );


    shuffledQuestions.forEach((q,displayIndex)=>{

        const originalIndex =
            q.originalIndex;

        const questionDiv =
            document.createElement("div");

        questionDiv.className =
            "question";


        const title =
            document.createElement("div");

        title.className =
            "question-title";

        title.textContent =
            `${displayIndex + 1}. ${q.question}`;

        questionDiv.appendChild(title);


        /*
           خلط الاختيارات
        */

        const shuffledOptions =
            shuffle(q.options);


        shuffledOptions.forEach(option=>{

            const button =
                document.createElement("button");

            button.className =
                "option";

            button.textContent =
                option;


            button.onclick = function(){

                /*
                   لا يمكن تغيير الإجابة
                */

                if(
                    selectedAnswers[originalIndex] !== null
                ){
                    return;
                }


                selectedAnswers[originalIndex] =
                    option;


                button.classList.add(
                    "selected"
                );


                const allOptions =
                    questionDiv
                    .querySelectorAll(".option");


                allOptions.forEach(btn=>{
                    btn.disabled = true;
                });

            };


            questionDiv.appendChild(button);

        });


        container.appendChild(questionDiv);

    });

}


/* =====================================================
   تسليم الامتحان
===================================================== */

function submitExam(){

    const unanswered =
        selectedAnswers.filter(
            answer => answer === null
        ).length;


    if(unanswered > 0){

        alert(
            `لم يتم الإجابة على ${unanswered} سؤال.`
        );

        return;
    }


    const confirmSubmit =
        confirm(
            "هل أنت متأكد من تسليم الامتحان؟\n\nبعد التسليم لن تستطيع تعديل إجاباتك."
        );


    if(!confirmSubmit){
        return;
    }


    let score = 0;


    questions.forEach((q,index)=>{

        if(
            selectedAnswers[index] === q.answer
        ){
            score++;
        }

    });


    const percentage =
        Math.round(
            (score / questions.length) * 100
        );


    document
        .getElementById("examPage")
        .classList.add("hidden");


    document
        .getElementById("resultPage")
        .classList.remove("hidden");


    document
        .getElementById("resultStudent")
        .textContent = studentName;


    document
        .getElementById("scoreText")
        .textContent =
        `${score} / ${questions.length}`;


    document
        .getElementById("percentageText")
        .textContent =
        `${percentage}%`;


    showReview();

}


/* =====================================================
   مراجعة الإجابات
===================================================== */

function showReview(){

    const container =
        document.getElementById(
            "reviewContainer"
        );

    container.innerHTML = "";


    questions.forEach((q,index)=>{

        const studentAnswer =
            selectedAnswers[index];


        const isCorrect =
            studentAnswer === q.answer;


        const item =
            document.createElement("div");


        item.className =
            "review-item " +
            (
                isCorrect
                ? "correct"
                : "wrong"
            );


        const question =
            document.createElement("div");

        question.className =
            "review-question";

        question.textContent =
            `${index + 1}. ${q.question}`;


        item.appendChild(question);


        if(isCorrect){

            const message =
                document.createElement("div");

            message.className =
                "correct-message";

            message.textContent =
                "✅ Correct Answer";

            item.appendChild(message);

        }else{

            const wrong =
                document.createElement("div");

            wrong.className =
                "wrong-answer";

            wrong.textContent =
                `❌ Your Answer: ${studentAnswer}`;


            const correct =
                document.createElement("div");

            correct.className =
                "correct-answer";

            correct.textContent =
                `✅ Correct Answer: ${q.answer}`;


            item.appendChild(wrong);

            item.appendChild(correct);

        }


        container.appendChild(item);

    });

}

</script>

</body>
    </html>
